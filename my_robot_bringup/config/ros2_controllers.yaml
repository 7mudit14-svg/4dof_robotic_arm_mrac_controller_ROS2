# ros2_controllers.yaml  (my_robot_bringup/config/)
# Loaded by gz_ros2_control plugin via spawner.
#
# FIXES:
#  - arm_effort_controller type: effort_controllers/JointGroupEffortController
#    does NOT exist in Jazzy. Correct type is:
#    forward_command_controller/ForwardCommandController
#  - update_rate: 1000 caused timing issues in VirtualBox — reduced to 100
#  - Removed controller_names list (not needed, spawner handles loading)

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_effort_controller:
      type: forward_command_controller/ForwardCommandController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - gripper_left_finger_joint
      - gripper_right_finger_joint

arm_effort_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
    interface_name: effort

gripper_controller:
  ros__parameters:
    joints:
      - gripper_left_finger_joint
      - gripper_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
