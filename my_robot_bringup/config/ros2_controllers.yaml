# ros2_controllers.yaml  (my_robot_bringup/config/)
# Loaded by the gz_ros2_control plugin (see my_robot.ros2_control.xacro).
#
# The arm is driven by the MRAC controller plugin, which writes joint efforts
# directly. Its own parameters live in
# mrac_controller/src/robust_direct_mrac_params.yaml and are passed by the
# spawner in my_robot_gz.launch.py.

controller_manager:
  ros__parameters:
    # 1 kHz = Gazebo's physics step. The MRAC gain bounds in
    # robust_direct_mrac_params.yaml are sized for this rate; if the
    # simulation cannot keep up, lower it together with those bounds.
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mrac_arm_controller:
      type: mrac_controller/MracController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - gripper_left_finger_joint
      - gripper_right_finger_joint

gripper_controller:
  ros__parameters:
    joints:
      - gripper_left_finger_joint
      - gripper_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
