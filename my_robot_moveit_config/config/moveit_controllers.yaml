# moveit_controllers.yaml  (my_robot_moveit_config/config/)
#
# CRITICAL: MoveItSimpleControllerManager LOOKS FOR PARAMETERS like:
# /moveit_simple_controller_manager/mrac_arm_controller/type
# /moveit_simple_controller_manager/mrac_arm_controller/action_ns
# Must be nested under moveit_simple_controller_manager/ in YAML.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - mrac_arm_controller
    - gripper_controller
  mrac_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - gripper_left_finger_joint
